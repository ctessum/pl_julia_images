name: Build and push images

# Manually triggered: Actions tab -> "Build and push images" -> "Run workflow".
#
# Builds the grader and pluto-workspace images for linux/amd64 and linux/arm64, each
# on a native runner (Julia crashes under emulation), and smoke-tests the workspace image.
# Each architecture is pushed to Docker Hub as ctessum/<image>:<version>-<arch>; the
# "publish" job then combines them into the multi-platform tag ctessum/<image>:<version>.
# amd64 is required; if the arm64 build fails, <version> is published for amd64 only.
#
# The "latest" tag is only moved if "also_latest" is checked. It is moved at the very end,
# after the smoke tests pass, by re-tagging the already-pushed versioned images.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub user that owns the ctessum/* repositories
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to push (for example 0.8.6)"
        required: true
        type: string
      also_latest:
        description: "Also move the \"latest\" tag to this version (after the smoke test passes)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-images
  cancel-in-progress: false

env:
  NAMESPACE: ctessum

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    # The arm64 image is nice to have (Apple Silicon); only amd64 is required.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ inputs.version }}
      # Per-architecture tag.
      # with the same tag.
      TAG: ${{ inputs.version }}-${{ matrix.arch }}
    steps:
      - name: Check the version tag
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Version '$VERSION' must look like 0.8.6 (and cannot be 'latest')."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The images are several GB and the runner has little free disk, so remove tools we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both images are built from the one Dockerfile in the root of the repository (targets "grader"
      # and "workspace"); they share the stages that install the course packages, which are only built once.
      - name: Build and push grader image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: grader
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.NAMESPACE }}/pl-julia-datascience-grader:${{ env.TAG }}

      - name: Build and push pluto-workspace image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: workspace
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.NAMESPACE }}/pl-julia-datascience-pluto-workspace:${{ env.TAG }}

      - name: Smoke test the workspace image
        run: |
          image="$NAMESPACE/pl-julia-datascience-pluto-workspace:$TAG"
          docker run -d --name smoke --memory=1g -p 1234:1234 --user 1001:1001 "$image"

          echo "--- Versions"
          docker exec smoke julia --version
          echo "Pluto in server env: $(docker exec smoke julia --project=/home/julia/server -e 'using Pkg; print(Pkg.dependencies()[Base.UUID("c3e4b0f8-55cb-11ea-2926-15256bba5781")].version)')"

          echo "--- Waiting for Pluto to answer on port 1234"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:1234/; then
              echo "Pluto is up after about $((i * 5)) seconds."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              break
            fi
            sleep 5
          done
          echo "::error::Pluto did not start."
          docker logs smoke
          exit 1

      - name: Show workspace container logs
        if: always()
        run: docker logs smoke || true

  publish:
    name: Publish ${{ inputs.version }}
    needs: build
    # Runs only if the amd64 build succeeded (an arm64 failure does not fail the build job).
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Combine the per-architecture images into one multi-platform tag
        run: |
          for image in pl-julia-datascience-grader pl-julia-datascience-pluto-workspace; do
            sources=()
            for arch in amd64 arm64; do
              if docker buildx imagetools inspect "$NAMESPACE/$image:$VERSION-$arch" > /dev/null 2>&1; then
                sources+=("$NAMESPACE/$image:$VERSION-$arch")
              fi
            done
            if ! docker buildx imagetools inspect "$NAMESPACE/$image:$VERSION-amd64" > /dev/null 2>&1; then
              echo "::error::The amd64 image of $image is missing."
              exit 1
            fi
            echo "$image: ${sources[*]}"
            docker buildx imagetools create --tag "$NAMESPACE/$image:$VERSION" "${sources[@]}"
          done

      # Only runs after everything above has passed.
      - name: Move the "latest" tag
        if: ${{ inputs.also_latest }}
        run: |
          for image in pl-julia-datascience-grader pl-julia-datascience-pluto-workspace; do
            docker buildx imagetools create \
              --tag "$NAMESPACE/$image:latest" \
              "$NAMESPACE/$image:$VERSION"
          done
